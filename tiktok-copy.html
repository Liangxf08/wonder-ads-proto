<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TikTok - Wonder Ads</title>
  <link rel="icon" href="素材/logo.png" type="image/png" />
  <link rel="stylesheet" href="design-tokens.css" />
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  <link rel="stylesheet" href="product-common.css" />
  <link rel="stylesheet" href="col-resize.css" />
  <link rel="stylesheet" href="shell.css" />
  <link rel="stylesheet" href="tiktok-copy.css" />
</head>
<body>
  <div class="app" id="appShell">
    <header class="header"></header>
    <div class="body">
      <aside class="sidebar" id="sidebar"></aside>
      <main class="main" data-main>
        <div class="content-card">
          <div class="filter-panel">
            <div class="page-tabs" role="tablist" aria-label="TikTok 文案库">
              <button class="page-tabs__item is-active" type="button" role="tab" aria-selected="true" data-tab="copy" id="tabCopy">文案</button>
              <button class="page-tabs__item" type="button" role="tab" aria-selected="false" data-tab="pack" id="tabPack">标题包</button>
            </div>

            <div class="filter-bar" id="copyFilterBar">
              <div class="filter-item">
                <div class="input-clearable" id="copyTextFilterWrap">
                  <input class="input" id="copyTextFilter" type="text" placeholder="文案" autocomplete="off" />
                  <button class="select-clear" type="button" aria-label="清除">
                    <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l6 6M9 3L3 9"/></svg>
                  </button>
                </div>
              </div>
              <div class="filter-item" id="copyCreatorWrap">
                <button class="select-trigger" type="button" id="copyCreatorTrigger">
                  <span class="select-trigger__text" id="copyCreatorLabel">创建人：<span class="muted">请选择</span></span>
                  <svg class="select-trigger__arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
                </button>
                <button class="select-clear" type="button" id="copyCreatorClear" aria-label="清除">
                  <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l6 6M9 3L3 9"/></svg>
                </button>
                <div class="multi-panel multi-panel--simple" id="copyCreatorPanel">
                  <div class="multi-panel__list" id="copyCreatorList"></div>
                </div>
              </div>
              <div class="filter-actions">
                <button class="btn btn--default" type="button" id="copyResetBtn">重置</button>
                <button class="btn btn--primary" type="button" id="copyQueryBtn">查询</button>
                <button class="btn btn--success" type="button" id="copyAddBtn">添加</button>
              </div>
            </div>

            <div class="filter-bar" id="packFilterBar" hidden>
              <div class="filter-item">
                <div class="input-clearable" id="packNameFilterWrap">
                  <input class="input" id="packNameFilter" type="text" placeholder="标题包" autocomplete="off" />
                  <button class="select-clear" type="button" aria-label="清除">
                    <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l6 6M9 3L3 9"/></svg>
                  </button>
                </div>
              </div>
              <div class="filter-item" id="packCreatorWrap">
                <button class="select-trigger" type="button" id="packCreatorTrigger">
                  <span class="select-trigger__text" id="packCreatorLabel">创建人：<span class="muted">请选择</span></span>
                  <svg class="select-trigger__arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
                </button>
                <button class="select-clear" type="button" id="packCreatorClear" aria-label="清除">
                  <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l6 6M9 3L3 9"/></svg>
                </button>
                <div class="multi-panel multi-panel--simple" id="packCreatorPanel">
                  <div class="multi-panel__list" id="packCreatorList"></div>
                </div>
              </div>
              <div class="filter-actions">
                <button class="btn btn--default" type="button" id="packResetBtn">重置</button>
                <button class="btn btn--primary" type="button" id="packQueryBtn">查询</button>
                <button class="btn btn--success" type="button" id="packAddBtn">添加</button>
              </div>
            </div>
          </div>

          <div class="data-panel" id="copyPanel">
            <div class="table-shell">
              <div class="table-wrap">
                <table class="data-table" id="copyTable">
                  <colgroup>
                    <col data-col-width="360" />
                    <col data-col-width="100" />
                    <col data-col-width="100" />
                    <col data-col-width="180" />
                    <col data-col-width="140" />
                  </colgroup>
                  <thead>
                    <tr>
                      <th>文案</th>
                      <th>字符数</th>
                      <th>创建人</th>
                      <th>创建时间</th>
                      <th class="col-action">操作</th>
                    </tr>
                  </thead>
                  <tbody id="copyBody"></tbody>
                </table>
                <div class="empty-tip" id="copyEmpty" hidden>暂无数据</div>
              </div>
            </div>
            <div class="pagination" id="copyPagination"></div>
          </div>

          <div class="data-panel" id="packPanel" hidden>
            <div class="table-shell">
              <div class="table-wrap">
                <table class="data-table" id="packTable">
                  <colgroup>
                    <col data-col-width="360" />
                    <col data-col-width="100" />
                    <col data-col-width="100" />
                    <col data-col-width="180" />
                    <col data-col-width="140" />
                  </colgroup>
                  <thead>
                    <tr>
                      <th>标题包名称</th>
                      <th>文案数</th>
                      <th>创建人</th>
                      <th>创建时间</th>
                      <th class="col-action">操作</th>
                    </tr>
                  </thead>
                  <tbody id="packBody"></tbody>
                </table>
                <div class="empty-tip" id="packEmpty" hidden>暂无数据</div>
              </div>
            </div>
            <div class="pagination" id="packPagination"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div class="page-msg page-msg--success" id="pageMsg" role="status" aria-live="polite"></div>

  <div class="modal-mask" id="copyModal" aria-hidden="true">
    <div class="modal modal--form" role="dialog" aria-modal="true" aria-labelledby="copyModalTitle">
      <div class="modal__header">
        <div class="modal__title" id="copyModalTitle">添加文案</div>
        <button class="modal__close" type="button" id="copyModalClose" aria-label="关闭">
          <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 2l8 8M10 2L2 10"/></svg>
        </button>
      </div>
      <div class="modal__body">
        <div class="form-item" id="copyTextItem">
          <label class="form-item__label is-required">文案</label>
          <div class="form-item__control">
            <div class="line-editor" id="copyLineEditor"></div>
            <div class="copy-box" id="copyEditBox" hidden>
              <textarea class="textarea copy-edit__input" id="copyEditText" placeholder="请输入"></textarea>
              <span class="copy-box__count" id="copyEditCount">0/100</span>
            </div>
            <div class="form-item__error">请输入文案</div>
          </div>
        </div>
      </div>
      <div class="modal__footer">
        <button class="btn btn--default" type="button" id="copyCancelBtn">取消</button>
        <button class="btn btn--primary" type="button" id="copySubmitBtn">提交</button>
      </div>
    </div>
  </div>

  <div class="modal-mask" id="packModal" aria-hidden="true">
    <div class="modal modal--form" role="dialog" aria-modal="true" aria-labelledby="packModalTitle">
      <div class="modal__header">
        <div class="modal__title" id="packModalTitle">添加标题包</div>
        <button class="modal__close" type="button" id="packModalClose" aria-label="关闭">
          <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 2l8 8M10 2L2 10"/></svg>
        </button>
      </div>
      <div class="modal__body">
        <div class="form-item" id="packNameItem">
          <label class="form-item__label is-required" for="packName">标题包名称</label>
          <div class="form-item__control">
            <div class="input-clearable" id="packNameWrap">
              <input class="input" id="packName" type="text" placeholder="请输入" autocomplete="off" />
              <button class="select-clear" type="button" aria-label="清除">
                <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l6 6M9 3L3 9"/></svg>
              </button>
            </div>
            <div class="form-item__error">请输入标题包名称</div>
          </div>
        </div>
        <div class="form-item" id="packCopiesItem">
          <label class="form-item__label is-required">文案</label>
          <div class="form-item__control">
            <div class="line-editor" id="packLineEditor"></div>
            <div class="form-item__error">请输入文案</div>
          </div>
        </div>
      </div>
      <div class="modal__footer">
        <button class="btn btn--default" type="button" id="packCancelBtn">取消</button>
        <button class="btn btn--primary" type="button" id="packSubmitBtn">提交</button>
      </div>
    </div>
  </div>

  <div class="modal-mask modal-mask--confirm" id="deleteModal" aria-hidden="true">
    <div class="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="deleteTitle">
      <button class="confirm-modal__close" type="button" id="deleteClose" aria-label="关闭">
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 2l8 8M10 2L2 10"/></svg>
      </button>
      <div class="confirm-modal__main">
        <span class="confirm-modal__icon confirm-modal__icon--danger" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" clip-rule="evenodd" d="M24 44c11.046 0 20-8.954 20-20S35.046 4 24 4 4 12.954 4 24s8.954 20 20 20Zm4.955-27.771-4.95 4.95-4.95-4.95a1 1 0 0 0-1.414 0l-1.414 1.414a1 1 0 0 0 0 1.414l4.95 4.95-4.95 4.95a1 1 0 0 0 0 1.414l1.414 1.414a1 1 0 0 0 1.414 0l4.95-4.95 4.95 4.95a1 1 0 0 0 1.414 0l1.414-1.414a1 1 0 0 0 0-1.414l-4.95-4.95 4.95-4.95a1 1 0 0 0 0-1.414l-1.414-1.414a1 1 0 0 0-1.414 0Z"/></svg>
        </span>
        <div class="confirm-modal__content">
          <h2 class="confirm-modal__title" id="deleteTitle">删除确认</h2>
          <p class="confirm-modal__body">此操作不可撤销，确认删除吗？</p>
        </div>
      </div>
      <div class="confirm-modal__footer">
        <button class="btn btn--default" type="button" id="deleteCancel">取消</button>
        <button class="btn btn--primary" type="button" id="deleteOk">确认</button>
      </div>
    </div>
  </div>

  <script src="product-common.js"></script>
  <script src="menu-data.js"></script>
  <script src="shell.js" data-page="tiktok-copy"></script>
  <script src="col-resize.js"></script>
  <script src="tiktok-copy.js"></script>
</body>
</html>
