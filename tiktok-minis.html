<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini 列表 - Wonder Ads</title>
  <link rel="icon" href="素材/logo.png" type="image/png" />
  <link rel="stylesheet" href="design-tokens.css" />
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  <link rel="stylesheet" href="product-common.css" />
  <link rel="stylesheet" href="col-resize.css" />
  <link rel="stylesheet" href="shell.css" />
  <link rel="stylesheet" href="tiktok-minis.css" />
</head>
<body>
  <div class="app" id="appShell">
    <header class="header"></header>
    <div class="body">
      <aside class="sidebar" id="sidebar"></aside>
      <main class="main" data-main>
        <div class="content-card">
          <div class="filter-bar" id="filterBar">
            <div class="filter-item">
              <div class="input-clearable" id="accountKeywordWrap">
                <input class="input" id="accountKeyword" type="text" placeholder="账户名称/ID" autocomplete="off" />
                <button class="select-clear" type="button" id="accountKeywordClear" aria-label="清除">
                  <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l6 6M9 3L3 9"/></svg>
                </button>
              </div>
            </div>

            <div class="filter-item">
              <div class="input-clearable" id="miniKeywordWrap">
                <input class="input" id="miniKeyword" type="text" placeholder="Mini 名称/ID" autocomplete="off" />
                <button class="select-clear" type="button" id="miniKeywordClear" aria-label="清除">
                  <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l6 6M9 3L3 9"/></svg>
                </button>
              </div>
            </div>

            <div class="filter-item" id="typeWrap">
              <button class="select-trigger" type="button" id="typeTrigger">
                <span class="select-trigger__text" id="typeLabel">类型：<span class="muted">请选择</span></span>
                <svg class="select-trigger__arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
              </button>
              <button class="select-clear" type="button" id="typeClear" aria-label="清除">
                <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l6 6M9 3L3 9"/></svg>
              </button>
              <div class="single-panel" id="typePanel">
                <button class="single-option" type="button" data-value="短剧">短剧</button>
                <button class="single-option" type="button" data-value="小游戏">小游戏</button>
              </div>
            </div>

            <div class="filter-item" id="statusWrap">
              <button class="select-trigger" type="button" id="statusTrigger">
                <span class="select-trigger__text" id="statusLabel">状态：<span class="muted">请选择</span></span>
                <svg class="select-trigger__arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
              </button>
              <button class="select-clear" type="button" id="statusClear" aria-label="清除">
                <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l6 6M9 3L3 9"/></svg>
              </button>
              <div class="single-panel" id="statusPanel">
                <button class="single-option" type="button" data-value="已激活">已激活</button>
                <button class="single-option" type="button" data-value="未激活">未激活</button>
              </div>
            </div>

            <div class="filter-actions">
              <button class="btn btn--default" type="button" id="resetBtn">重置</button>
              <button class="btn btn--primary" type="button" id="queryBtn">查询</button>
            </div>
          </div>

          <div class="data-panel" id="dataPanel">
            <div class="table-shell">
              <div class="table-wrap">
                <table class="data-table" id="miniTable">
                  <colgroup>
                    <col data-col-width="200" />
                    <col data-col-width="200" />
                    <col data-col-width="200" />
                    <col data-col-width="180" />
                    <col data-col-width="100" />
                    <col data-col-width="180" />
                    <col data-col-width="100" />
                    <col data-col-width="180" />
                  </colgroup>
                  <thead>
                    <tr>
                      <th>账户名称</th>
                      <th>账户ID</th>
                      <th>Mini 名称</th>
                      <th>Mini ID</th>
                      <th>类型</th>
                      <th>上线地区</th>
                      <th>状态</th>
                      <th>更新时间</th>
                    </tr>
                  </thead>
                  <tbody id="tableBody"></tbody>
                </table>
                <div class="empty-tip" id="emptyTip" hidden>暂无数据</div>
              </div>
            </div>
            <div class="pagination" id="pagination"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div class="page-msg page-msg--success" id="pageMsg" role="status" aria-live="polite"></div>

  <script src="product-common.js"></script>
  <script src="menu-data.js"></script>
  <script src="shell.js" data-page="tiktok-minis"></script>
  <script src="col-resize.js"></script>
  <script src="tiktok-minis.js"></script>
</body>
</html>
