<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>小游戏 - Wonder Ads</title>
  <link rel="icon" href="素材/logo.png" type="image/png" />
  <link rel="stylesheet" href="design-tokens.css" />
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  <link rel="stylesheet" href="product-common.css" />
  <link rel="stylesheet" href="col-resize.css" />
  <link rel="stylesheet" href="shell.css" />
  <link rel="stylesheet" href="minis.css" />
</head>
<body>
  <div class="app" id="appShell">
    <header class="header"></header>
    <div class="body">
      <aside class="sidebar" id="sidebar"></aside>
      <main class="main" data-main>
      <div class="content-card">
        <div class="filter-bar">
          <div class="filter-item">
            <input class="input" id="filterKeyword" type="text" placeholder="产品名称/ID" autocomplete="off" />
          </div>
          <div class="filter-item">
            <input class="input" id="filterClientKey" type="text" placeholder="Client key" autocomplete="off" />
          </div>

          <div class="filter-item" id="categoryWrap">
            <button class="select-trigger" type="button" id="categoryTrigger">
              <span class="select-trigger__text" id="categoryLabel">类别：<span class="muted">请选择</span></span>
              <svg class="select-trigger__arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
            </button>
            <button class="select-clear" type="button" id="categoryClear" aria-label="清除">
              <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l6 6M9 3L3 9"/></svg>
            </button>
            <div class="multi-panel" id="categoryPanel">
              <div class="multi-panel__left">
                <div class="multi-panel__search">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
                  <input id="categorySearch" type="text" placeholder="搜索" autocomplete="off" />
                </div>
                <div class="multi-panel__toolbar">
                  <button class="multi-panel__link" type="button" id="categorySelectAll">全选</button>
                </div>
                <div class="multi-panel__list" id="categoryList"></div>
              </div>
              <div class="multi-panel__right">
                <div class="multi-panel__toolbar multi-panel__toolbar--right">
                  <span id="categoryCount">已选择 0 项</span>
                  <button class="multi-panel__link" type="button" id="categoryPanelClear">清空</button>
                </div>
                <div class="multi-panel__list" id="categorySelected"></div>
              </div>
            </div>
          </div>

          <div class="filter-item" id="typeWrap">
            <button class="select-trigger" type="button" id="typeTrigger">
              <span class="select-trigger__text" id="typeLabel">产品类型：<span class="muted">请选择</span></span>
              <svg class="select-trigger__arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
            </button>
            <button class="select-clear" type="button" id="typeClear" aria-label="清除">
              <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l6 6M9 3L3 9"/></svg>
            </button>
            <div class="multi-panel" id="typePanel">
              <div class="multi-panel__left">
                <div class="multi-panel__search">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
                  <input id="typeSearch" type="text" placeholder="搜索" autocomplete="off" />
                </div>
                <div class="multi-panel__toolbar">
                  <button class="multi-panel__link" type="button" id="typeSelectAll">全选</button>
                </div>
                <div class="multi-panel__list" id="typeList"></div>
              </div>
              <div class="multi-panel__right">
                <div class="multi-panel__toolbar multi-panel__toolbar--right">
                  <span id="typeCount">已选择 0 项</span>
                  <button class="multi-panel__link" type="button" id="typePanelClear">清空</button>
                </div>
                <div class="multi-panel__list" id="typeSelected"></div>
              </div>
            </div>
          </div>

          <div class="filter-item" id="groupWrap">
            <button class="select-trigger" type="button" id="groupTrigger">
              <span class="select-trigger__text" id="groupLabel">产品组：<span class="muted">请选择</span></span>
              <svg class="select-trigger__arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
            </button>
            <button class="select-clear" type="button" id="groupClear" aria-label="清除">
              <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l6 6M9 3L3 9"/></svg>
            </button>
            <div class="multi-panel multi-panel--simple" id="groupPanel">
              <div class="multi-panel__list" id="groupList"></div>
            </div>
          </div>

          <div class="filter-item" id="ownerWrap">
            <button class="select-trigger" type="button" id="ownerTrigger">
              <span class="select-trigger__text" id="ownerLabel">负责人：<span class="muted">请选择</span></span>
              <svg class="select-trigger__arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
            </button>
            <button class="select-clear" type="button" id="ownerClear" aria-label="清除">
              <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l6 6M9 3L3 9"/></svg>
            </button>
            <div class="multi-panel" id="ownerPanel">
              <div class="multi-panel__left">
                <div class="multi-panel__search">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
                  <input id="ownerSearch" type="text" placeholder="搜索" autocomplete="off" />
                </div>
                <div class="multi-panel__toolbar">
                  <button class="multi-panel__link" type="button" id="ownerSelectAll">全选</button>
                </div>
                <div class="multi-panel__list" id="ownerList"></div>
              </div>
              <div class="multi-panel__right">
                <div class="multi-panel__toolbar multi-panel__toolbar--right">
                  <span id="ownerCount">已选择 0 项</span>
                  <button class="multi-panel__link" type="button" id="ownerPanelClear">清空</button>
                </div>
                <div class="multi-panel__list" id="ownerSelected"></div>
              </div>
            </div>
          </div>

          <div class="filter-item" id="statusWrap">
            <button class="select-trigger" type="button" id="statusTrigger">
              <span class="select-trigger__text" id="statusLabel">状态：<span class="muted">请选择</span></span>
              <svg class="select-trigger__arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
            </button>
            <button class="select-clear" type="button" id="statusClear" aria-label="清除">
              <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l6 6M9 3L3 9"/></svg>
            </button>
            <div class="single-panel" id="statusPanel">
              <div class="single-option" data-value="启用">启用</div>
              <div class="single-option" data-value="禁用">禁用</div>
            </div>
          </div>

          <div class="filter-actions">
            <button class="btn btn--default" type="button" id="resetBtn">重置</button>
            <button class="btn btn--primary" type="button" id="searchBtn">查询</button>
            <button class="btn btn--success" type="button" id="syncBtn">同步</button>
            <button class="btn btn--default" type="button" id="importBtn">导入</button>
          </div>
        </div>

        <div class="data-panel">
          <div class="table-shell">
          <div class="table-wrap">
            <table class="data-table" id="dataTable">
              <colgroup>
                <col class="col-name" data-col-width="180" />
                <col class="col-platform" data-col-width="100" />
                <col class="col-id" data-col-width="140" />
                <col class="col-key" data-col-width="180" />
                <col class="col-link" data-col-width="328" />
                <col class="col-category" data-col-width="100" />
                <col class="col-type" data-col-width="100" />
                <col class="col-group" data-col-width="100" />
                <col class="col-owner" data-col-width="100" />
                <col class="col-status" data-col-width="100" />
                <col class="col-time" data-col-width="180" />
                <col class="col-time" data-col-width="180" />
                <col class="col-action" data-col-width="80" />
              </colgroup>
              <thead>
                <tr>
                  <th class="col-name is-freeze">产品名称</th>
                  <th class="col-platform">平台</th>
                  <th class="col-id">产品ID</th>
                  <th class="col-key">Client key</th>
                  <th class="col-link">点击链接</th>
                  <th class="col-category">类别</th>
                  <th class="col-type">产品类型</th>
                  <th class="col-group">产品组</th>
                  <th class="col-owner">负责人</th>
                  <th class="col-status">状态</th>
                  <th class="col-time">创建时间</th>
                  <th class="col-time">更新时间</th>
                  <th class="col-action">操作</th>
                </tr>
              </thead>
              <tbody id="tableBody"></tbody>
            </table>
            <div class="empty-tip" id="emptyTip" hidden>暂无数据</div>
          </div>
        </div>

        <div class="pagination" id="pagination"></div>
          </div>
      </div>
    </main>
    </div>
  </div>

  <div class="page-msg page-msg--success" id="pageMsg" role="status"></div>

  <div class="modal-mask" id="formModal" aria-hidden="true">
    <div class="modal modal--form" role="dialog" aria-modal="true" aria-labelledby="formModalTitle">
      <div class="modal__header">
        <div class="modal__title" id="formModalTitle">编辑产品</div>
        <button class="modal__close" type="button" id="formModalClose" aria-label="关闭">
          <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 2l10 10M12 2L2 12"/></svg>
        </button>
      </div>
      <div class="modal__body">
        <div class="form-item">
          <div class="form-item__label">平台</div>
          <div class="form-item__control">
            <div class="seg is-readonly" id="platformSeg" role="radiogroup" aria-label="平台">
              <button class="seg__item is-active" type="button" role="radio" data-value="TikTok" aria-checked="true">TikTok</button>
            </div>
          </div>
        </div>
        <div class="form-item">
          <div class="form-item__label">产品名称</div>
          <div class="form-item__control">
            <input class="input" id="formName" type="text" disabled />
          </div>
        </div>
        <div class="form-item">
          <div class="form-item__label">点击链接</div>
          <div class="form-item__control">
            <div class="input-clearable" id="formClickLinkWrap">
              <input class="input" id="formClickLink" type="text" placeholder="请输入" autocomplete="off" />
              <button class="select-clear" type="button" id="formClickLinkClear" aria-label="清除"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l6 6M9 3L3 9"/></svg></button>
            </div>
          </div>
        </div>
      </div>
      <div class="modal__footer">
        <button class="btn btn--default" type="button" id="formCancelBtn">取消</button>
        <button class="btn btn--primary" type="button" id="formSubmitBtn">提交</button>
      </div>
    </div>
  </div>

  <div class="modal-mask" id="importModal" aria-hidden="true">
    <div class="modal modal--large" role="dialog" aria-modal="true" aria-labelledby="importTitle">
      <div class="modal__header">
        <h2 class="modal__title" id="importTitle">导入</h2>
        <button class="modal__close" type="button" id="importClose" aria-label="关闭">
          <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 2l8 8M10 2L2 10"/></svg>
        </button>
      </div>
      <div class="modal__body">
        <div class="import-actions">
          <button class="btn btn--primary" type="button" id="uploadBtn">上传文件</button>
          <button class="link" type="button" id="downloadTemplateBtn">下载模板</button>
          <input type="file" id="importFile" accept=".csv,.xls,text/csv,application/vnd.ms-excel" hidden />
        </div>
        <div class="import-alert" id="importAlert" role="alert">
          <svg class="import-alert__icon import-alert__icon--error" viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="8" cy="8" r="6.667" fill="currentColor"/>
            <path fill="var(--color-white)" d="M5.05 4.34a.6.6 0 0 1 .85 0L8 6.44l2.1-2.1a.6.6 0 0 1 .85.85L8.85 7.29l2.1 2.1a.6.6 0 0 1-.85.85L8 8.14l-2.1 2.1a.6.6 0 0 1-.85-.85l2.1-2.1-2.1-2.1a.6.6 0 0 1 0-.85Z"/>
          </svg>
          <svg class="import-alert__icon import-alert__icon--success" viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="8" cy="8" r="6.667" fill="currentColor"/>
            <path fill="var(--color-white)" d="M6.95 10.06 4.72 7.83l-.9.9 3.13 3.13 5.2-5.2-.9-.9-4.3 4.3Z"/>
          </svg>
          <span id="importAlertText"></span>
        </div>
        <div class="import-table-shell">
          <div class="import-table-wrap">
            <table class="import-table" id="importTable">
              <colgroup>
                <col data-col-width="220" />
                <col data-col-width="360" />
                <col data-col-width="240" />
              </colgroup>
              <thead>
                <tr>
                  <th>Client key</th>
                  <th>点击链接</th>
                  <th class="col-error">错误信息</th>
                </tr>
              </thead>
              <tbody id="importBody"></tbody>
            </table>
          </div>
          <div class="import-empty" id="importEmpty">暂无数据</div>
        </div>
      </div>
      <div class="modal__footer">
        <button class="btn btn--default" type="button" id="importCancel">取消</button>
        <button class="btn btn--primary" type="button" id="importSave">提交</button>
      </div>
    </div>
  </div>

  <script src="product-common.js"></script>
  <script src="menu-data.js"></script>
  <script src="shell.js" data-page="minis"></script>
  <script src="col-resize.js"></script>
  <script src="minis.js"></script>
</body>
</html>
